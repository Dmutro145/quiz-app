<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестування студентів</title>
    <!-- Підключаємо Bootstrap для гарного дизайну -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-top: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Реєстрація на тестування</h4>
                </div>
                <div class="card-body">
                    <form id="registrationForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Прізвище та Ім'я</label>
                            <input type="text" class="form-control" id="fullName" required placeholder="Іванов Іван">
                        </div>
                        <div class="mb-3">
                            <label for="groupName" class="form-label">Академічна група</label>
                            <input type="text" class="form-control" id="groupName" required placeholder="КН-21">
                        </div>
                        <div class="mb-3">
                            <label for="discipline" class="form-label">Оберіть дисципліну</label>
                            <select class="form-select" id="discipline" required>
                                <option value="" disabled selected>Завантаження...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="lecture" class="form-label">Оберіть лекцію</label>
                            <select class="form-select" id="lecture" required disabled>
                                <option value="" disabled selected>Спочатку оберіть дисципліну</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Почати тест</button>
                    </form>
                </div>
            </div>
        </div>
                        <!-- Кнопка для викладача (додати в самий низ картки) -->
                <div class="text-center mt-4 mb-5">
                    <a href="/teacher" class="btn btn-outline-secondary">
                        Вхід для викладача (Кабінет результатів)
                    </a>
                </div>
    </div>
</div>

<!-- Підключаємо скрипт для логіки -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const disciplineSelect = document.getElementById('discipline');
        const lectureSelect = document.getElementById('lecture');

        // 1. Завантажуємо дисципліни при відкритті сторінки
        fetch('/api/disciplines')
            .then(response => response.json())
            .then(data => {
                disciplineSelect.innerHTML = '<option value="" disabled selected>Оберіть дисципліну</option>';
                data.forEach(disc => {
                    const option = document.createElement('option');
                    option.value = disc.id;
                    option.textContent = disc.name;
                    disciplineSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Помилка завантаження дисциплін:', error));

        // 2. Коли обрано дисципліну, завантажуємо її лекції
        disciplineSelect.addEventListener('change', function() {
            const disciplineId = this.value;
            lectureSelect.innerHTML = '<option value="" disabled selected>Завантаження...</option>';
            lectureSelect.disabled = true;

            fetch(`/api/disciplines/${disciplineId}/lectures`)
                .then(response => response.json())
                .then(data => {
                    lectureSelect.innerHTML = '<option value="" disabled selected>Оберіть лекцію</option>';
                    data.forEach(lect => {
                        const option = document.createElement('option');
                        option.value = lect.id;
                        option.textContent = lect.title;
                        lectureSelect.appendChild(option);
                    });
                    lectureSelect.disabled = false;
                })
                .catch(error => console.error('Помилка завантаження лекцій:', error));
        });

              // 3. Обробка відправки форми
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Зберігаємо дані у браузері, щоб передати їх на наступну сторінку
            const studentData = {
                full_name: document.getElementById('fullName').value,
                group_name: document.getElementById('groupName').value,
                discipline_id: disciplineSelect.value,
                lecture_id: lectureSelect.value,
                lecture_title: lectureSelect.options[lectureSelect.selectedIndex].text
            };
            
            localStorage.setItem('studentData', JSON.stringify(studentData));
            
            // Переходимо на сторінку тесту
            window.location.href = '/test'; 
        });
    });
</script>
</body>
</html>
